services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evh
      POSTGRES_PASSWORD: evh_secret
      POSTGRES_DB: evh_heatscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evh -d evh_heatscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://evh:evh_secret@db:5432/evh_heatscan
      DATABASE_URL_SYNC: postgresql://evh:evh_secret@db:5432/evh_heatscan
      JWT_SECRET_KEY: change-me-in-production
      ALLOWED_ORIGINS: https://yourdomain.com
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - prod

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    profiles:
      - prod

volumes:
  postgres_data:
